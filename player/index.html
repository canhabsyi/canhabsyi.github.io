<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clappr Player</title>
    
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/canhabsyi/canal86@main/logo/play.png" type="image/png" />

    <!-- Script Keamanan -->
    <script src="https://cdn.jsdelivr.net/gh/canhabsyi/canal86@main/lock.js"></script>
    <script disable-devtool-auto src="https://cdn.jsdelivr.net/gh/canhabsyi/canal86@main/dev.js"></script>

    <!-- Clappr & Shaka Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback@latest/dist/dash-shaka-playback.js"></script>

    <style>
        /* Reset margin & pastikan background hitam penuh */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; 
        }

        /* Container player memenuhi layar */
        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* --- CSS UNTUK MENYEMBUNYIKAN TIME BAR / DVR --- */
        /* Menyembunyikan bar progress (seek bar) */
        .media-control[data-media-control] .media-control-center-panel,
        .media-control[data-media-control] .bar-container {
            display: none !important;
        }
        
        /* Menyembunyikan teks indikator waktu (misal: 00:00 / 01:20) */
        .media-control-indicator[data-time-indicator] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="player-container"></div>

    <script>
        // 1. Fungsi Mengambil Parameter URL
        function getParameterByName(name) {
            name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
            var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
                results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, " "));
        }

        // 2. Tangkap URL dan Key DRM (Menggunakan k1 dan k2)
        var videoUrl = getParameterByName('url') || 'https://canhabsyi.github.io/hls/playlist.m3u8';
        var k1 = getParameterByName('k1');
        var k2 = getParameterByName('k2');

        var clearKeysConfig = {};
        if (k1 && k2) {
            clearKeysConfig[k1] = k2;
        }

        // 3. Inisialisasi Clappr Player
        var player = new Clappr.Player({
            source: videoUrl,
            plugins: { 
                playback: [DashShakaPlayback],
                remove: ['click_to_pause'] // Menonaktifkan jeda saat tengah layar diklik
            },
            parentId: '#player-container',
            width: "100%",
            height: "100%",
            autoPlay: true,
            mute: true, // Wajib mute awal agar autoplay diizinkan browser
            poster: "https://cdn.jsdelivr.net/gh/canhabsyi/canal86@main/gif/loading.gif",
            shakaConfiguration: {
                drm: {
                    clearKeys: clearKeysConfig
                }
            }
        });

        // 4. Logika Volume & Unmute
        if (player) {
            player.setVolume(50); 
        }
        
        document.body.addEventListener('click', () => {
            if (player) {
                if (player.core && player.core.mediaControl) {
                    player.core.mediaControl.unmute();
                } else {
                    player.setVolume(50);
                }
            }
        }, { once: true });

        // 5. Fungsi Rotasi Layar (Landscape) saat Fullscreen
        function onFullScreenChange() {
            var isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            
            if (isFullscreen) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {
                        console.log("Kunci orientasi gagal: ", err);
                    });
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }

        document.addEventListener('fullscreenchange', onFullScreenChange);
        document.addEventListener('webkitfullscreenchange', onFullScreenChange);
        document.addEventListener('mozfullscreenchange', onFullScreenChange);
        document.addEventListener('MSFullscreenChange', onFullScreenChange);
    </script>
</body>
</html>
